<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1a1b26"/>
  <rect x="3" y="1" width="10" height="1" fill="#bb9af7"/>
  <rect x="2" y="2" width="12" height="10" fill="#414868"/>
  <rect x="3" y="3" width="10" height="8" fill="#24283b"/>
  <rect x="4" y="4" width="8" height="1" fill="#414868">
    <animate attributeName="y" values="4;6;8;10;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#414868;#bb9af7;#414868" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="5" width="8" height="3" fill="#1a1b26"/>
  <rect x="5" y="6" width="2" height="1" fill="#bb9af7">
    <animate attributeName="fill" values="#bb9af7;#ff75c3;#ffffff;#bb9af7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="9" y="6" width="2" height="1" fill="#bb9af7">
    <animate attributeName="fill" values="#bb9af7;#ff75c3;#ffffff;#bb9af7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="9" width="8" height="2" fill="#1a1b26"/>
  <rect x="5" y="9" width="6" height="1" fill="#bcd3ff">
    <animate attributeName="width" values="2;6;4;6" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="7;5;6;5" dur="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="6" y="12" width="4" height="2" fill="#414868"/>
  <rect x="3" y="14" width="10" height="1" fill="#24283b"/>
  <rect x="4" y="14" width="8" height="1" fill="#bb9af7"/>
  <rect x="7" y="13" width="2" height="1" fill="#bcd3ff">
    <animate attributeName="fill" values="#bcd3ff;#9ece6a;#bcd3ff" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
