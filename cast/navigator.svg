<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1a1b26"/>
  <rect x="7" y="0" width="2" height="2" fill="#2ac3de">
    <animate attributeName="fill" values="#2ac3de;#73daca;#ffffff;#2ac3de" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="2" width="10" height="2" fill="#2ac3de"/>
  <rect x="4" y="1" width="8" height="1" fill="#73daca"/>
  <rect x="2" y="4" width="12" height="8" fill="#24283b"/>
  <rect x="3" y="4" width="10" height="7" fill="#414868"/>
  <rect x="4" y="5" width="8" height="3" fill="#1a1b26"/>
  <rect x="4" y="6" width="8" height="1" fill="#2ac3de">
    <animate attributeName="x" values="4;7;9;4" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="width" values="3;2;3;3" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="5" y="6" width="2" height="1" fill="#73daca"/>
  <rect x="9" y="6" width="2" height="1" fill="#73daca"/>
  <rect x="4" y="9" width="8" height="2" fill="#1a1b26"/>
  <rect x="5" y="9" width="6" height="1" fill="#2ac3de">
    <animate attributeName="height" values="1;2;1;1" dur="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="5" width="1" height="4" fill="#2ac3de">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="5" width="1" height="4" fill="#73daca">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="12" width="10" height="3" fill="#24283b"/>
  <rect x="6" y="13" width="4" height="1" fill="#73daca">
    <animate attributeName="fill" values="#73daca;#2ac3de;#ffffff;#73daca" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
