<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1a1b26"/>
  <rect x="4" y="1" width="8" height="1" fill="#bcd3ff"/>
  <rect x="3" y="2" width="10" height="2" fill="#7aa2f7"/>
  <rect x="2" y="4" width="12" height="1" fill="#bcd3ff"/>
  <rect x="3" y="5" width="10" height="7" fill="#414868"/>
  <rect x="4" y="5" width="8" height="3" fill="#1a1b26"/>
  <rect x="5" y="6" width="2" height="1" fill="#bcd3ff">
    <animate attributeName="fill" values="#bcd3ff;#7dcfff;#bcd3ff" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="9" y="6" width="2" height="2" fill="#7dcfff">
    <animate attributeName="fill" values="#7dcfff;#9ece6a;#ffffff;#7dcfff" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="9" width="8" height="2" fill="#1a1b26"/>
  <rect x="5" y="9" width="6" height="1" fill="#7aa2f7">
    <animate attributeName="height" values="1;2;1;1" dur="0.65s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="6" width="2" height="3" fill="#7aa2f7"/>
  <rect x="13" y="6" width="2" height="3" fill="#bcd3ff">
    <animate attributeName="fill" values="#bcd3ff;#7dcfff;#bcd3ff" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="1" width="1" height="2" fill="#7dcfff">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="12" width="10" height="3" fill="#24283b"/>
  <rect x="4" y="12" width="8" height="1" fill="#414868"/>
  <rect x="6" y="13" width="4" height="1" fill="#bcd3ff"/>
</svg>
