  </rect>
  <rect x="1" y="5" width="1" height="5" fill="#e0af68">
    <animate attributeName="y" values="4;6;4" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="5" width="1" height="5" fill="#f0d068">
    <animate attributeName="y" values="6;4;6" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="12" width="10" height="3" fill="#24283b"/>
  <rect x="4" y="12" width="8" height="1" fill="#e0af68"/>
  <rect x="6" y="13" width="4" height="1" fill="#f0d068">
    <animate attributeName="fill" values="#f0d068;#7dcfff;#f0d068" dur="1.0s" repeatCount="indefinite"/>
  </rect>
