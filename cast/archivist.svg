<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1a1b26"/>
  <rect x="3" y="1" width="10" height="2" fill="#e0af68"/>
  <rect x="4" y="0" width="8" height="1" fill="#f0d068"/>
  <rect x="2" y="3" width="12" height="9" fill="#414868"/>
  <rect x="3" y="3" width="10" height="8" fill="#24283b"/>
  <rect x="4" y="5" width="8" height="3" fill="#1a1b26"/>
  <rect x="5" y="6" width="2" height="1" fill="#f0d068"/>
  <rect x="9" y="5" width="3" height="3" fill="#e0af68">
    <animate attributeName="fill" values="#e0af68;#ffffff;#f0d068;#e0af68" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="6" width="1" height="1" fill="#1a1b26"/>
