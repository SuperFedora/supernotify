    <animate attributeName="height" values="1;2;1" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="4" width="1" height="5" fill="#ff9e64"/>
  <rect x="14" y="4" width="1" height="5" fill="#ff9e64"/>
  <rect x="2" y="12" width="12" height="3" fill="#24283b"/>
  <rect x="3" y="12" width="10" height="1" fill="#ff9e64"/>
  <rect x="6" y="13" width="4" height="1" fill="#f0d068">
    <animate attributeName="fill" values="#f0d068;#ffffff;#f0d068" dur="0.7s" repeatCount="indefinite"/>
  </rect>
</svg>
